apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payments-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.paymentsPostgres.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-postgres
  template:
    metadata:
      labels:
        app: payments-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.paymentsPostgres.image }}
          ports:
            - containerPort: {{ .Values.paymentsPostgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.paymentsPostgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.paymentsPostgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.paymentsPostgres.db | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: payments-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: payments-postgres
spec:
  selector:
    app: payments-postgres
  ports:
    - port: 5432
      targetPort: 5432
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
spec:
  replicas: {{ .Values.paymentsService.replicas }}
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z payments-postgres 5432;
              do echo "waiting for payments-postgres"; sleep 2;
              done
      containers:
        - name: payments-service
          image: "{{ .Values.registry }}/{{ .Values.paymentsService.image }}:{{ .Values.paymentsService.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.paymentsService.port }}
          env:
            - name: PORT
              value: "{{ .Values.paymentsService.env.PORT }}"
            - name: DB_HOST
              value: "{{ .Values.paymentsService.env.DB_HOST }}"
            - name: DB_PORT
              value: "{{ .Values.paymentsService.env.DB_PORT }}"
            - name: DB_USER
              value: "{{ .Values.paymentsService.env.DB_USER }}"
            - name: DB_PASSWORD
              value: "{{ .Values.paymentsService.env.DB_PASSWORD }}"
            - name: DB_NAME
              value: "{{ .Values.paymentsService.env.DB_NAME }}"
          resources:
            requests:
              cpu: {{ .Values.paymentsService.resources.requests.cpu }}
              memory: {{ .Values.paymentsService.resources.requests.memory }}
            limits:
              cpu: {{ .Values.paymentsService.resources.limits.cpu }}
              memory: {{ .Values.paymentsService.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.paymentsService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.paymentsService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
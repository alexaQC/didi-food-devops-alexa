apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  labels:
    app: users-service
spec:
  replicas: {{ .Values.usersService.replicas }}
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z users-postgres 5432;
              do echo "waiting for users-postgres"; sleep 2;
              done
      containers:
        - name: users-service
          image: {{ .Values.registry }}/{{ .Values.usersService.image }}:{{ .Values.usersService.tag }}
          ports:
            - containerPort: {{ .Values.usersService.port }}
          env:
            - name: PORT
              value: {{ .Values.usersService.env.PORT | quote }}
            - name: DB_HOST
              value: {{ .Values.usersService.env.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.usersService.env.DB_PORT | quote }}
            - name: DB_USER
              value: {{ .Values.usersService.env.DB_USER | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.usersService.env.DB_PASSWORD | quote }}
            - name: DB_NAME
              value: {{ .Values.usersService.env.DB_NAME | quote }}
          resources:
{{ toYaml .Values.usersService.resources | indent 12 }}